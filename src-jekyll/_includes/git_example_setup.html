<div class="git-example-note">
  <p>To recreate the examples, configure <code>git c</code> once as an alias for creating empty commits:</p>
  <pre><code class="language-bash">git config --global alias.c "commit --allow-empty"</code></pre>
  <p>Run setup commands in a fresh directory, then apply each operation to that same repository in the order shown.</p>
</div>
